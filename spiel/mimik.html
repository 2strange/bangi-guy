<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bangi – Mimik</title>
<style>
  html, body { margin: 0; height: 100%; background: #8fe0ff; font: 14px/1.3 sans-serif; color: #123; }
  table { border-collapse: collapse; margin: 6px auto; }
  th { font-weight: bold; padding: 2px 4px; text-align: center; }
  th.row { text-align: right; padding-right: 10px; white-space: nowrap; font-size: 12px; }
  td { padding: 2px; }
  canvas { display: block; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<pre id="err" style="position:fixed;top:0;left:0;margin:0;padding:8px;background:#fff;color:#c00;font:14px monospace;white-space:pre-wrap;display:none;z-index:9"></pre>
<script>
  window.showErr = (m) => { const e = document.getElementById('err'); e.style.display = 'block'; e.textContent += m + '\n'; };
  window.addEventListener('error', (e) => showErr((e.message || e.type) + ' @ ' + (e.filename || '') + ':' + (e.lineno || '')));
  window.addEventListener('unhandledrejection', (e) => showErr('rejection: ' + (e.reason && (e.reason.stack || e.reason))));
</script>
<table id="grid"></table>
<script type="module">
// Vorschau aller Gesichter × Stimmungen als reines 2D-Raster: Kopf = Scheibe in Hautfarbe, Gesicht als Decal drüber.
// Oben die drei festen Figuren, darunter alle Kunden aus data/kunden.json (Felder hautton/bart/brille/haare).
Promise.all([import('./js/faces.js'), fetch('./data/kunden.json').then((r) => r.json())]).then(([{ faceCanvas, kundeFace, kundeSkin, FACE_MOODS }, data]) => {
  const css = (hex) => '#' + hex.toString(16).padStart(6, '0');
  const rows = [
    ['Schluffi', (mood) => faceCanvas('schluffi', mood, { skin: '#f0b98a' }), '#f0b98a'],
    ['Turnschuh-Typ', (mood) => faceCanvas('runner', mood, { skin: '#e8a773' }), '#e8a773'],
    ['Sonne', (mood) => faceCanvas('sun', mood), '#ffd93b'],
  ];
  for (const k of data.kunden) {
    const label = `${k.name ?? k.id} · ${k.hautton}/${k.bart}/${k.brille}/${k.haare}`;
    rows.push([label, (mood) => kundeFace(k, mood).image, css(kundeSkin(k))]);
  }
  const W = window.innerWidth, H = window.innerHeight;
  const cell = Math.floor(Math.min((W - 330) / FACE_MOODS.length, (H - 40) / rows.length) - 6);
  const table = document.getElementById('grid');
  const head = table.insertRow();
  head.insertCell();
  for (const mood of FACE_MOODS) { const th = document.createElement('th'); th.textContent = mood; head.appendChild(th); }
  for (const [label, paint, skin] of rows) {
    const tr = table.insertRow();
    const th = document.createElement('th'); th.className = 'row'; th.textContent = label; tr.appendChild(th);
    for (const mood of FACE_MOODS) {
      const c = document.createElement('canvas');
      c.width = cell; c.height = cell;
      const ctx = c.getContext('2d');
      const r = cell * 0.47;
      ctx.fillStyle = skin; ctx.strokeStyle = '#111'; ctx.lineWidth = Math.max(3, cell * 0.03);
      ctx.beginPath(); ctx.arc(cell / 2, cell / 2, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      // das Decal deckt nur das vordere Kugelsegment ab: etwas kleiner als die Scheibe zeichnen
      const s = r * 1.7;
      ctx.drawImage(paint(mood), cell / 2 - s / 2, cell / 2 - s / 2 + r * 0.05, s, s);
      tr.insertCell().appendChild(c);
    }
  }
}).catch((e) => showErr('import: ' + (e.stack || e)));
</script>
</body>
</html>
