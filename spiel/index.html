<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #8fe0ff; touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
  canvas { display: block; touch-action: none; }
  #hint { position: fixed; left: 12px; bottom: 10px; font: 13px/1.3 sans-serif; color: #123; background: rgba(255,255,255,.65); padding: 5px 9px; border-radius: 6px; pointer-events: none; }
  /* Comic-Overlay */
  :root { --ink: #111; --paper: #fff8e6; }
  .comic { font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", "Segoe Print", sans-serif; color: var(--ink); }
  #hud { position: fixed; left: 12px; top: 10px; display: flex; gap: 10px; pointer-events: none; }
  .hud-item { background: var(--paper); border: 3px solid var(--ink); border-radius: 12px; padding: 4px 12px; font-size: 18px; box-shadow: 3px 3px 0 var(--ink); }
  .hud-item .clock { margin-left: 6px; font-weight: normal; opacity: .85; }
  .hud-item.heat-2 { background: #ffd54a; } .hud-item.heat-3 { background: #e8463a; color: #fff; }
  #prompt { position: fixed; left: 50%; bottom: 46px; transform: translateX(-50%); display: none; background: var(--paper); border: 3px solid var(--ink); border-radius: 14px; padding: 6px 16px; font-size: 18px; box-shadow: 3px 3px 0 var(--ink); pointer-events: none; }
  #bubble { position: fixed; display: none; max-width: 380px; background: #fff; border: 4px solid var(--ink); border-radius: 22px; padding: 12px 16px 10px; font-size: 19px; box-shadow: 5px 5px 0 var(--ink); z-index: 5; }
  #bubble::after { content: ""; position: absolute; left: 50%; bottom: -26px; width: 0; height: 0; border: 14px solid transparent; border-top: 18px solid var(--ink); transform: translateX(-50%); }
  #bubble::before { content: ""; position: absolute; left: 50%; bottom: -17px; width: 0; height: 0; border: 11px solid transparent; border-top: 14px solid #fff; transform: translateX(-50%); z-index: 1; }
  #bubble .who { font-size: 13px; font-weight: bold; letter-spacing: .5px; color: #555; text-transform: uppercase; margin-bottom: 2px; }
  #bubble .say { margin-bottom: 8px; }
  .opts { display: flex; gap: 8px; flex-wrap: wrap; }
  button.opt { font: inherit; font-size: 16px; background: var(--paper); border: 3px solid var(--ink); border-radius: 10px; padding: 4px 10px; cursor: pointer; box-shadow: 2px 2px 0 var(--ink); }
  button.opt.sel { background: #ffd54a; transform: translate(-1px, -1px); box-shadow: 3px 3px 0 var(--ink); }
  button.opt .key { display: inline-block; min-width: 18px; padding: 0 4px; margin-right: 4px; border: 2px solid var(--ink); border-radius: 6px; background: #fff; font-size: 13px; text-align: center; }
  #arrest { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(20, 30, 60, .55); z-index: 6; }
  #arrest .card { background: var(--paper); border: 5px solid var(--ink); border-radius: 24px; padding: 24px 36px; text-align: center; box-shadow: 8px 8px 0 var(--ink); max-width: 520px; }
  #arrest h1 { margin: 0 0 10px; font-size: 44px; color: #e8463a; letter-spacing: 2px; }
  #arrest p { font-size: 20px; margin: 6px 0 14px; } #arrest .small { font-size: 15px; color: #555; }
  #arrest h1.rot { color: #e8463a; } #arrest h1 { color: #2a3f8f; }
  .hud-item.empty { background: #e8463a; color: #fff; }
  /* Touch-Steuerung (nur auf Touch-Geräten bzw. ?touch=1) */
  #touch { display: none; position: fixed; inset: 0; pointer-events: none; z-index: 4; }
  #joy { position: absolute; left: 18px; bottom: 18px; width: 170px; height: 170px; pointer-events: auto; touch-action: none; }
  #joy-base { position: absolute; left: 15px; top: 15px; width: 140px; height: 140px; border-radius: 50%; background: rgba(255,248,230,.55); border: 4px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); }
  #joy-knob { position: absolute; left: 36px; top: 36px; width: 60px; height: 60px; border-radius: 50%; background: #ffd54a; border: 4px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); }
  #touch-buttons { position: absolute; right: 14px; bottom: 18px; display: flex; align-items: flex-end; gap: 10px; pointer-events: auto; }
  .tbtn { width: 84px; height: 84px; border-radius: 50%; background: var(--paper); border: 4px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); font: inherit; font-size: 30px; line-height: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; touch-action: none; }
  .tbtn span { font-size: 13px; font-weight: bold; }
  .tbtn.small { width: 44px; height: 44px; font-size: 20px; border-width: 3px; box-shadow: 3px 3px 0 var(--ink); margin-bottom: 6px; }
  .tbtn:active { background: #ffd54a; transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--ink); }
  body.touch button.opt { font-size: 17px; padding: 8px 14px; min-height: 44px; }
  body.touch #bubble { max-width: 86vw; font-size: 17px; padding: 8px 12px 8px; }
  body.touch #prompt { bottom: 120px; font-size: 14px; padding: 4px 10px; }
  /* Hinweis als kleine Pille am Rand (Inspect-Ansicht bleibt frei) */
  #prompt.pill { left: auto; right: 12px; bottom: auto; top: 54px; transform: none; font-size: 13px; padding: 3px 10px; border-width: 2px; box-shadow: 2px 2px 0 var(--ink); opacity: .9; }
  /* Pille schlägt die Touch-Regel (gleiche ID-Spezifität, deshalb explizit bottom/left zurücksetzen) */
  body.touch #prompt.pill, #prompt.pill { top: 48px; right: 10px; bottom: auto; left: auto; transform: none; width: auto; max-width: 70vw; }
  /* blinkendes Tasten-Badge über der Figur */
  #badge { position: fixed; display: none; gap: 4px; transform: translate(-50%, -100%); pointer-events: none; z-index: 3; animation: blink 1s steps(2, start) infinite; }
  #badge .key { display: inline-block; min-width: 22px; padding: 2px 7px; border: 3px solid var(--ink); border-radius: 8px; background: #ffd54a; font-size: 16px; font-weight: bold; text-align: center; box-shadow: 2px 2px 0 var(--ink); }
  @keyframes blink { 50% { opacity: .35; } }
  .tbtn.pulse { animation: pulse .9s ease-in-out infinite; background: #ffd54a; }
  @keyframes pulse { 50% { transform: scale(1.12); } }
  /* Bark: kleine englische Blase über dem Kopf */
  .bark { position: fixed; display: none; background: #fff; border: 3px solid var(--ink); border-radius: 14px; padding: 3px 10px; font-size: 15px; font-weight: bold; white-space: nowrap; box-shadow: 3px 3px 0 var(--ink); pointer-events: none; z-index: 3; }
  .bark::after { content: ""; position: absolute; left: 50%; bottom: -14px; border: 7px solid transparent; border-top: 9px solid var(--ink); transform: translateX(-50%); }
  body.touch .bark { font-size: 13px; padding: 2px 8px; }
  /* Mute im HUD */
  #mute, #music, #optionen { pointer-events: auto; cursor: pointer; font-size: 18px; line-height: 1; }
  #mute.muted, #music.muted { opacity: .6; }
  @media (max-width: 720px), (max-height: 500px) { #music { right: 52px; } #optionen { right: 92px; } #mute, #music, #optionen { top: 40px; } } /* schmal: zweite Reihe, nicht über dem HUD */
  /* Ziel-Zeile unter dem HUD: Tagesziel mit Fortschritt + Wochenstand */
  #ziel { position: fixed; left: 12px; top: 52px; display: none; background: var(--paper); border: 2px solid var(--ink); border-radius: 10px; padding: 3px 10px; font-size: 14px; box-shadow: 2px 2px 0 var(--ink); pointer-events: none; max-width: min(70vw, 720px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #ziel .fort { display: inline-block; border: 2px solid var(--ink); border-radius: 8px; padding: 0 6px; margin-left: 4px; background: #fff; font-weight: bold; }
  #ziel .fort.ok { background: #3bb84a; color: #fff; }
  @media (max-width: 720px), (max-height: 500px) { #ziel { top: 34px; font-size: 11px; padding: 2px 7px; max-width: 58vw; } }
  /* Tutorial Tag 1: Hinweiskasten oben mit Überspringen-Knopf; HUD-Puls fürs Heat-Ziel */
  #tutorial { position: fixed; left: 50%; top: 58px; transform: translateX(-50%); display: none; width: min(92vw, 560px); background: var(--paper); border: 3px solid var(--ink); border-radius: 14px; padding: 10px 14px; font-size: 17px; box-shadow: 4px 4px 0 var(--ink); z-index: 4; pointer-events: auto; }
  #tutorial .skip { display: inline-block; margin-top: 8px; font-size: 13px; padding: 3px 10px; min-height: 30px; }
  .hud-item.pulse { animation: pulse .9s ease-in-out infinite; background: #ffd54a; }
  @media (max-width: 720px), (max-height: 500px) { #tutorial { top: 76px; font-size: 14px; padding: 8px 10px; } }
  /* Optionen-Menü (⚙): Sprache, Beschlagnahme, Musik, Ton — große Knöpfe, auch für den Daumen */
  #menue { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(20, 30, 60, .55); z-index: 7; }
  #menue .card { background: var(--paper); border: 5px solid var(--ink); border-radius: 24px; padding: 20px 28px; box-shadow: 8px 8px 0 var(--ink); width: min(92vw, 460px); }
  #menue h1 { margin: 0 0 12px; font-size: 32px; color: #2a3f8f; text-align: center; }
  #menue .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 10px 0; font-size: 18px; }
  #menue .seg { display: flex; gap: 6px; flex-shrink: 0; }
  #menue .seg button.opt { min-width: 64px; min-height: 40px; padding: 6px 12px; }
  #menue .small { font-size: 14px; color: #555; margin: 4px 0 10px; }
  #menue .close { display: block; margin: 14px auto 0; min-height: 44px; }
  @media (max-width: 720px), (max-height: 500px) { #menue .card { padding: 14px 16px; } #menue h1 { font-size: 24px; } #menue .row { font-size: 15px; } }
  /* schmale Bildschirme: alles kompakter */
  @media (max-width: 720px), (max-height: 500px) {
    .hud-item { font-size: 13px; padding: 2px 8px; border-width: 2px; box-shadow: 2px 2px 0 var(--ink); }
    #hud { gap: 6px; left: 8px; top: 6px; }
    #hint { display: none; }
    #arrest .card { padding: 14px 18px; } #arrest h1 { font-size: 28px; } #arrest p { font-size: 15px; }
    .tbtn { width: 62px; height: 62px; font-size: 24px; } .tbtn span { font-size: 11px; } .tbtn.small { width: 40px; height: 40px; font-size: 18px; }
    #touch-buttons { gap: 8px; right: 10px; bottom: 14px; }
    #joy { width: 130px; height: 130px; } #joy-base { width: 104px; height: 104px; left: 13px; top: 13px; } #joy-knob { width: 46px; height: 46px; left: 25px; top: 25px; }
  }
  /* Handy (hoch oder quer, auch als Vollbild-App): Blasen, Knöpfe, Karten und Rufe kleiner, damit die Szene sichtbar bleibt */
  @media (max-width: 720px), (max-height: 500px) {
    body #bubble, body.touch #bubble { max-width: min(78vw, 340px); font-size: 14px; padding: 6px 10px 6px; border-width: 3px; border-radius: 16px; box-shadow: 3px 3px 0 var(--ink); }
    #bubble .who { font-size: 10px; }
    body button.opt, body.touch button.opt { font-size: 13px; padding: 4px 9px; min-height: 32px; border-width: 2px; box-shadow: 2px 2px 0 var(--ink); }
    button.opt .key { font-size: 10px; min-width: 14px; padding: 0 3px; border-width: 1.5px; }
    .bark, body.touch .bark { font-size: 11px; padding: 1px 7px; border-width: 2px; box-shadow: 2px 2px 0 var(--ink); }
    #prompt, body.touch #prompt { font-size: 12px; padding: 3px 9px; border-width: 2px; }
    #badge .key { font-size: 12px; padding: 1px 5px; border-width: 2px; }
    #arrest .card { max-width: min(86vw, 440px); border-width: 3px; box-shadow: 4px 4px 0 var(--ink); } #arrest h1 { font-size: 22px; margin-bottom: 6px; } #arrest p { font-size: 13px; margin: 4px 0 8px; } #arrest .small { font-size: 12px; }
    #tutorial { font-size: 12px; padding: 6px 9px; width: min(86vw, 460px); }
    #menue h1 { font-size: 20px; } #menue .row { font-size: 13px; margin: 6px 0; } #menue .small { font-size: 12px; }
  }
  /* quer: wenig Höhe, Touch-Knöpfe und Stick noch etwas kleiner */
  @media (max-height: 500px) {
    .tbtn { width: 52px; height: 52px; font-size: 20px; } .tbtn span { font-size: 10px; } .tbtn.small { width: 34px; height: 34px; font-size: 15px; }
    #joy { width: 110px; height: 110px; } #joy-base { width: 88px; height: 88px; left: 11px; top: 11px; } #joy-knob { width: 40px; height: 40px; left: 24px; top: 24px; }
    #arrest .card { max-height: 88vh; overflow-y: auto; padding: 10px 14px; }
  }
  /* Touch: keine Tastatur-Hilfe; Notch und Home-Leiste (Vollbild-App) freihalten */
  body.touch #hint { display: none; }
  #hud, #ziel { margin-left: env(safe-area-inset-left); }
  #mute, #music, #optionen { margin-right: env(safe-area-inset-right); }
  #joy { margin-left: env(safe-area-inset-left); margin-bottom: env(safe-area-inset-bottom); }
  #touch-buttons { margin-right: env(safe-area-inset-right); margin-bottom: env(safe-area-inset-bottom); }
</style>

<div id="hint">WASD / Pfeile = gehen · Shift = „rennen“ · Q/R = Kamera drehen · T/G, Rad oder Ziehen = Kamera neigen · Klick = hinlaufen · E = ansprechen · F = genau hinschauen</div>

<pre id="err" style="position:fixed;top:0;left:0;margin:0;padding:8px;background:#fff;color:#c00;font:14px monospace;white-space:pre-wrap;display:none;z-index:9"></pre>
<script>
  // Laufzeitfehler sichtbar machen (auch im Screenshot-Modus): Text-Overlay statt leerem Bild
  window.showErr = (m) => { const e = document.getElementById('err'); e.style.display = 'block'; e.textContent += m + '\n'; };
  window.addEventListener('error', (e) => showErr((e.message || e.type) + ' @ ' + (e.filename || '') + ':' + (e.lineno || '')));
  window.addEventListener('unhandledrejection', (e) => showErr('rejection: ' + (e.reason && (e.reason.stack || e.reason))));
  if (/[?&]snap=1/.test(location.search)) document.getElementById('hint').remove();
</script>
<script type="module">import('./js/main.js').catch((e) => showErr('import: ' + (e.stack || e)));</script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});</script>
